[package]
name = "pragma-tauri"
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["lightweb.it <lightweb.it@gmail.com>"]
description = "Pragma Symphony desktop app — Tauri shell"
repository = "https://github.com/lightwebit/pragma-symphony"

[package.metadata.bundle]
identifier = "com.noema.pragma"
icon = ["icons/icon.ico"]

[lib]
name = "pragma_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# E2E only (see .autotest/wdio/). Embeds a WebDriver server in the app so
# WebdriverIO can drive it — deliberately opt-in and never enabled in a shipped
# build, since it would let any local process automate the app.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                       = { version = "2", features = [] }
tauri-plugin-wdio            = { version = "1", optional = true }
tauri-plugin-wdio-webdriver  = { version = "1", optional = true }
tauri-plugin-notification   = { version = "2" }
tauri-plugin-single-instance = { version = "2" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1", features = ["v4"] }
tokio       = { version = "1", features = ["process", "io-util", "time", "macros", "rt"] }
pragma-parser = { path = "../pragma-parser" }
rfd           = "0.14"
portable-pty  = "0.8"
chrono        = { version = "0.4", features = ["serde"] }
