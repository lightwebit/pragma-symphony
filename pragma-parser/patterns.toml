# Pragma — Pattern configuration
# Edit this file to add/fix patterns without recompiling.
# This file takes precedence over the embedded defaults.
# Patterns are matched against lines of the Claude CLI output.
#
# NOTE: Claude Code in other languages uses different phrases from English.
# Paths may be wrapped in backticks: `path/to/file.rs`
# The capture group must extract the path with or without backticks.

[error]
prefixes = [
  "Error:",
  "error[",
  "FAILED",
  "panicked at",
  "thread '",
  "× ",
  "✗ ",
  "fatal:",
  "ERROR ",
  "Errore:",
]
stderr_prefix = "stderr:"

[tool_use]
prefixes = [
  "Bash(",
  "Read(",
  "Write(",
  "Edit(",
  "Glob(",
  "Grep(",
  "Agent(",
  "WebFetch(",
  "WebSearch(",
  "Task",
  "<tool_use>",
  "Tool:",
  "Running tool:",
]

[diff]
start_markers = ["--- a/", "+++ b/"]
hunk_marker = "@@ "

# ---------------------------------------------------------------------------
# FILE_TOUCH patterns
# Order: from most specific to most generic.
# Group 1 captures the path, with or without backticks.
# The path is then validated by is_valid_path().
# ---------------------------------------------------------------------------

# --- ITALIAN (Claude Code in the Italian language) ---

[[file_touch.patterns]]
regex = "(?i)file creato in `([^`]+)`"
action = "Create"

[[file_touch.patterns]]
regex = "(?i)file creato:? `?([^`\\.]+\\.[^`\\s]+)`?"
action = "Create"

[[file_touch.patterns]]
regex = "(?i)(?:ho )?scritto (?:il file )?`([^`]+)`"
action = "Create"

[[file_touch.patterns]]
regex = "(?i)file modificato(?: in)? `([^`]+)`"
action = "Modify"

[[file_touch.patterns]]
regex = "(?i)(?:ho )?modificato `([^`]+)`"
action = "Modify"

[[file_touch.patterns]]
regex = "(?i)(?:ho )?aggiornato `([^`]+)`"
action = "Modify"

[[file_touch.patterns]]
regex = "(?i)file eliminato `([^`]+)`"
action = "Delete"

[[file_touch.patterns]]
regex = "(?i)(?:ho )?eliminato `([^`]+)`"
action = "Delete"

# --- GENERIC — path in backticks (any language) ---
# Captures any line that mentions create/write/scritto/creato
# followed by a path in backticks

[[file_touch.patterns]]
regex = "(?i)(?:creat|writ|scriv|scritt).{0,30}`([^`]+)`"
action = "Create"

[[file_touch.patterns]]
regex = "(?i)(?:modif|updat|aggiornat).{0,30}`([^`]+)`"
action = "Modify"

[[file_touch.patterns]]
regex = "(?i)(?:delet|remov|eliminat|rimoss).{0,30}`([^`]+)`"
action = "Delete"

# --- Standard ENGLISH ---

[[file_touch.patterns]]
regex = "(?i)created? (?:file:? )?`?([^`\n]+)`?"
action = "Create"

[[file_touch.patterns]]
regex = "(?i)writing to:? `?([^`\n]+)`?"
action = "Create"

[[file_touch.patterns]]
regex = "✓ [Cc]reated? `?([^`\n]+)`?"
action = "Create"

[[file_touch.patterns]]
regex = "(?i)modif(?:ied|ying):? `?([^`\n]+)`?"
action = "Modify"

[[file_touch.patterns]]
regex = "(?i)updat(?:ed|ing):? `?([^`\n]+)`?"
action = "Modify"

[[file_touch.patterns]]
regex = "✓ [Uu]pdat(?:ed|ing) `?([^`\n]+)`?"
action = "Modify"

[[file_touch.patterns]]
regex = "✓ [Mm]odif(?:ied|ying) `?([^`\n]+)`?"
action = "Modify"

[[file_touch.patterns]]
regex = "(?i)delet(?:ed|ing):? `?([^`\n]+)`?"
action = "Delete"

[[file_touch.patterns]]
regex = "(?i)remov(?:ed|ing):? `?([^`\n]+)`?"
action = "Delete"

[[file_touch.patterns]]
regex = "✓ [Dd]elet(?:ed|ing) `?([^`\n]+)`?"
action = "Delete"
